name: ESP32

on:
  push:
    branches: [main]
    paths:
      - "targets/esp32/**"
      - "targets/esp32-bench/**"
      - "crates/arxia-core/**"
      - "crates/arxia-crypto/**"
      - "crates/arxia-lattice/**"
      - "crates/arxia-storage/**"
      - "crates/arxia-storage-flash/**"
      - "crates/arxia-flash-bench/**"
      - ".github/workflows/esp32.yml"
  pull_request:
    branches: [main]
    paths:
      - "targets/esp32/**"
      - "targets/esp32-bench/**"
      - "crates/arxia-core/**"
      - "crates/arxia-crypto/**"
      - "crates/arxia-lattice/**"
      - "crates/arxia-storage/**"
      - "crates/arxia-storage-flash/**"
      - "crates/arxia-flash-bench/**"
      - ".github/workflows/esp32.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  esp32-check:
    name: ESP32 Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          targets: riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - name: Check ESP32 crate
        run: cargo check -p arxia-esp32 --target riscv32imc-unknown-none-elf

  esp32-qemu-test:
    name: ESP32 QEMU Tests (pre-gossip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run pre-gossip tests (x86_64 simulation)
        run: |
          # The 24 pre-gossip PoC tests run on x86_64 as ESP32/QEMU proxy.
          # Full ESP32 QEMU integration requires espflash + qemu-system-xtensa.
          # TODO(M6-M12): Add espflash + QEMU runner for on-target testing.
          cargo test -p arxia-core -p arxia-crypto -p arxia-lattice

  esp32-bench-firmware:
    name: Bench firmware (xtensa-esp32-none-elf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the Xtensa toolchain
        run: |
          # Both espup and the Xtensa Rust release are pinned, so a new
          # upstream release cannot change this job. 1.95.0.0 is the
          # release the bench firmware is built and checked with locally.
          # curl -f fails on an HTTP error instead of saving the error
          # page as the binary.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 \
            https://github.com/esp-rs/espup/releases/download/v0.17.1/espup-x86_64-unknown-linux-gnu -o espup
          chmod a+x espup
          # espup downloads from GitHub release assets, which can answer
          # 504 for a while: retry the whole install before giving up.
          for attempt in 1 2 3; do
            ./espup install --targets esp32 --toolchain-version 1.95.0.0 && exit 0
            echo "espup install failed (attempt $attempt), retrying in 30 s"
            sleep 30
          done
          exit 1
      # After the install: the cache step runs cargo, which needs the
      # esp toolchain that rust-toolchain.toml names.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "targets/esp32-bench -> target"
      - name: Build the bench firmware
        working-directory: targets/esp32-bench
        run: |
          source ~/export-esp.sh
          cargo build --release
          cargo fmt --all -- --check
          cargo clippy --release -- -D warnings
